<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				/* The only motion: a slow, low-amplitude glow breathe. Barely there. */
				@keyframes breathe {
					0%   { opacity: 0.45; }
					50%  { opacity: 0.75; }
					100% { opacity: 0.45; }
				}

				.stage {
					position: relative;
					width: 100%;
					height: 400px;
					overflow: hidden;
					border-radius: 18px;
					font-family: 'Segoe UI', Roboto, Helvetica, Arial, system-ui, sans-serif;
					background:
						radial-gradient(60% 90% at 12% 8%, rgba(255,107,157,0.18) 0%, rgba(255,107,157,0) 60%),
						radial-gradient(65% 95% at 88% 100%, rgba(106,130,251,0.22) 0%, rgba(106,130,251,0) 62%),
						radial-gradient(50% 70% at 75% 12%, rgba(34,211,238,0.12) 0%, rgba(34,211,238,0) 60%),
						radial-gradient(130% 130% at 20% 0%, #171430 0%, #0c0a1e 55%, #060510 100%);
				}

				/* soft accent glow behind the card — the single animated element */
				.glow {
					position: absolute;
					top: 50%; left: 50%;
					width: 560px; height: 280px;
					transform: translate(-50%, -50%);
					background: radial-gradient(circle, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 68%);
					filter: blur(28px);
					animation: breathe 9s ease-in-out infinite;
				}

				.glass {
					position: absolute;
					top: 50%; left: 50%;
					transform: translate(-50%, -50%);
					width: 580px;
					padding: 50px 44px;
					border-radius: 26px;
					background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035));
					border: 1px solid rgba(255,255,255,0.16);
					box-shadow:
						0 24px 60px rgba(0,0,0,0.45),
						inset 0 1px 0 rgba(255,255,255,0.28);
					-webkit-backdrop-filter: blur(16px);
					backdrop-filter: blur(16px);
					text-align: center;
				}

				.eyebrow {
					display: inline-flex;
					align-items: center;
					gap: 10px;
					font-size: 12px;
					font-weight: 600;
					letter-spacing: 5px;
					text-transform: uppercase;
					color: rgba(226, 232, 255, 0.70);
					margin-bottom: 16px;
				}
				.eyebrow::before, .eyebrow::after {
					content: "";
					width: 28px; height: 1px;
					background: linear-gradient(90deg, transparent, #67e8f9);
				}
				.eyebrow::after { transform: scaleX(-1); }

				h1 {
					font-size: 44px;
					font-weight: 800;
					letter-spacing: 1px;
					line-height: 1.12;
					color: #f4f6ff;
					text-shadow: 0 2px 24px rgba(103, 232, 249, 0.18);
				}

				.tags {
					margin-top: 18px;
					font-size: 13.5px;
					font-weight: 500;
					letter-spacing: 1.5px;
					color: rgba(226, 232, 255, 0.76);
				}
				.dot { color: #67e8f9; margin: 0 9px; }
			</style>
			<div class="stage">
				<div class="glow"></div>
				<div class="glass">
					<div class="eyebrow">Software Engineer</div>
					<h1>Building Fast, Fluid Interfaces</h1>
					<div class="tags">
						React <span class="dot">&#8226;</span> React Native <span class="dot">&#8226;</span> TypeScript
					</div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
