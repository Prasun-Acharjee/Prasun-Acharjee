<svg viewBox="0 0 800 400" width="800" height="400" fill="none" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<style>
			/* Only opacity + tiny translate are animated: the blurred glows are
			   rendered once and re-composited, so motion stays smooth. */
			@keyframes glowA { from { opacity: .45; transform: translate(0px, 0px); }
			                     to { opacity: .85; transform: translate(14px, 10px); } }
			@keyframes glowB { from { opacity: .80; transform: translate(0px, 0px); }
			                     to { opacity: .45; transform: translate(-16px, -8px); } }
			@keyframes glowC { from { opacity: .40; transform: translate(0px, 0px); }
			                     to { opacity: .75; transform: translate(-12px, 12px); } }
			@keyframes halo  { from { opacity: .40; } to { opacity: .75; } }

			.g1   { animation: glowA 14s ease-in-out infinite alternate; }
			.g2   { animation: glowB 18s ease-in-out infinite alternate; }
			.g3   { animation: glowC 11s ease-in-out infinite alternate; }
			.halo { animation: halo  9s ease-in-out infinite alternate; }
		</style>

		<linearGradient id="bg" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#171430"/>
			<stop offset="0.55" stop-color="#0c0a1e"/>
			<stop offset="1" stop-color="#060510"/>
		</linearGradient>
		<radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#ff6b9d" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#6a82fb" stop-opacity="0.6"/>
			<stop offset="1" stop-color="#6a82fb" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
			<stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
		</radialGradient>

		<!-- sheen that travels across the title; reflect makes the loop seamless -->
		<linearGradient id="title" x1="0" y1="0" x2="420" y2="0"
			gradientUnits="userSpaceOnUse" spreadMethod="reflect">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.45" stop-color="#c7d0ff"/>
			<stop offset="0.7" stop-color="#9ff0ff"/>
			<stop offset="1" stop-color="#ffffff"/>
			<animateTransform attributeName="gradientTransform" type="translate"
				from="-420 0" to="0 0" dur="7s" repeatCount="indefinite"/>
		</linearGradient>

		<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
			<stop offset="1" stop-color="#67e8f9" stop-opacity="0.9"/>
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ff6b9d"/>
			<stop offset="0.5" stop-color="#8b5cf6"/>
			<stop offset="1" stop-color="#22d3ee"/>
		</linearGradient>
		<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="34"/>
		</filter>
	</defs>

	<!-- backdrop -->
	<rect x="0" y="0" width="800" height="400" rx="18" fill="url(#bg)"/>

	<!-- drifting aurora glows -->
	<g filter="url(#soft)">
		<ellipse class="g1" cx="70" cy="60" rx="180" ry="150" fill="url(#pink)"/>
		<ellipse class="g2" cx="720" cy="360" rx="220" ry="180" fill="url(#blue)"/>
		<ellipse class="g3" cx="640" cy="70" rx="150" ry="120" fill="url(#cyan)"/>
		<ellipse class="halo" cx="400" cy="200" rx="200" ry="120" fill="url(#violet)"/>
	</g>

	<!-- glass panel -->
	<rect x="90" y="103" width="620" height="194" rx="24" fill="#ffffff" fill-opacity="0.06"/>
	<rect x="90.5" y="103.5" width="619" height="193" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
	<rect x="106" y="104" width="588" height="1" rx="0.5" fill="#ffffff" fill-opacity="0.22"/>

	<!-- eyebrow -->
	<line x1="252" y1="152" x2="300" y2="152" stroke="url(#rule)" stroke-width="1"/>
	<line x1="548" y1="152" x2="500" y2="152" stroke="url(#rule)" stroke-width="1"/>
	<text x="400" y="156" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
		font-size="12" font-weight="600" letter-spacing="5" fill="#e2e8ff" fill-opacity="0.72">SOFTWARE ENGINEER</text>

	<!-- title -->
	<text x="400" y="214" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
		font-size="36" font-weight="800" letter-spacing="0.5" fill="url(#title)">Building Fast, Fluid Interfaces</text>

	<!-- accent bar -->
	<rect x="368" y="232" width="64" height="4" rx="2" fill="url(#accent)"/>

	<!-- tags -->
	<text x="400" y="270" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
		font-size="14" font-weight="500" letter-spacing="1.5" fill="#e2e8ff" fill-opacity="0.78">React<tspan fill="#67e8f9" dx="10" dy="0">&#8226;</tspan><tspan fill="#e2e8ff" fill-opacity="0.78" dx="10">React Native</tspan><tspan fill="#67e8f9" dx="10">&#8226;</tspan><tspan fill="#e2e8ff" fill-opacity="0.78" dx="10">TypeScript</tspan></text>
</svg>
