<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				/* Slow, gentle aurora drift — long durations + alternate = no snap at the loop */
				@keyframes drift1 {
					from { transform: translate(-6%, -4%) scale(1); }
					to   { transform: translate(6%, 5%) scale(1.12); }
				}
				@keyframes drift2 {
					from { transform: translate(5%, 4%) scale(1.05); }
					to   { transform: translate(-5%, -6%) scale(0.95); }
				}
				@keyframes drift3 {
					from { transform: translate(-4%, 6%) scale(1); }
					to   { transform: translate(6%, -4%) scale(1.1); }
				}
				/* Smooth vertical float for the glass card */
				@keyframes float {
					from { transform: translateY(-6px); }
					to   { transform: translateY(6px); }
				}
				/* Continuous flowing gradient on the title */
				@keyframes shimmer {
					to { background-position: 200% center; }
				}
				/* Slow breathing glow behind the card */
				@keyframes breathe {
					from { opacity: 0.55; transform: scale(1); }
					to   { opacity: 0.9; transform: scale(1.06); }
				}

				.stage {
					position: relative;
					width: 100%;
					height: 400px;
					overflow: hidden;
					border-radius: 18px;
					background: radial-gradient(130% 130% at 15% 0%, #171430 0%, #0c0a1e 55%, #060510 100%);
					font-family: 'Segoe UI', Roboto, Helvetica, Arial, system-ui, sans-serif;
				}

				.aurora {
					position: absolute;
					border-radius: 50%;
					filter: blur(70px);
					will-change: transform;
				}
				.aurora.one {
					width: 46%; height: 90%; top: -20%; left: -8%;
					background: radial-gradient(circle, #ff6b9d 0%, rgba(255,107,157,0) 70%);
					animation: drift1 22s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
				}
				.aurora.two {
					width: 52%; height: 100%; bottom: -25%; right: -10%;
					background: radial-gradient(circle, #6a82fb 0%, rgba(106,130,251,0) 70%);
					animation: drift2 26s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
				}
				.aurora.three {
					width: 40%; height: 80%; top: 10%; right: 18%;
					background: radial-gradient(circle, #22d3ee 0%, rgba(34,211,238,0) 70%);
					animation: drift3 19s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
				}

				.glow {
					position: absolute;
					top: 50%; left: 50%;
					width: 520px; height: 260px;
					transform: translate(-50%, -50%);
					background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, rgba(139,92,246,0) 70%);
					filter: blur(30px);
					animation: breathe 6s ease-in-out infinite alternate;
				}

				.glass {
					position: absolute;
					top: 50%; left: 50%;
					transform: translate(-50%, -50%);
					width: 580px;
					padding: 48px 44px;
					border-radius: 26px;
					background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
					border: 1px solid rgba(255,255,255,0.18);
					box-shadow:
						0 20px 50px rgba(0,0,0,0.40),
						inset 0 1px 0 rgba(255,255,255,0.30);
					-webkit-backdrop-filter: blur(16px);
					backdrop-filter: blur(16px);
					text-align: center;
					animation: float 7s ease-in-out infinite alternate;
				}

				.eyebrow {
					display: inline-flex;
					align-items: center;
					gap: 9px;
					font-size: 12px;
					font-weight: 600;
					letter-spacing: 5px;
					text-transform: uppercase;
					color: rgba(226, 232, 255, 0.72);
					margin-bottom: 16px;
				}
				.eyebrow::before, .eyebrow::after {
					content: "";
					width: 26px; height: 1px;
					background: linear-gradient(90deg, transparent, rgba(226,232,255,0.6));
				}
				.eyebrow::after { transform: scaleX(-1); }

				h1 {
					font-size: 44px;
					font-weight: 800;
					letter-spacing: 1px;
					line-height: 1.12;
					background: linear-gradient(90deg, #ffffff 0%, #a5b4fc 25%, #67e8f9 50%, #a5b4fc 75%, #ffffff 100%);
					background-size: 200% auto;
					-webkit-background-clip: text;
					background-clip: text;
					-webkit-text-fill-color: transparent;
					color: #ffffff;
					animation: shimmer 7s linear infinite;
				}

				.tags {
					margin-top: 18px;
					font-size: 13.5px;
					font-weight: 500;
					letter-spacing: 1.5px;
					color: rgba(226, 232, 255, 0.78);
				}
				.dot { color: #22d3ee; margin: 0 9px; }
			</style>
			<div class="stage">
				<div class="aurora one"></div>
				<div class="aurora two"></div>
				<div class="aurora three"></div>
				<div class="glow"></div>
				<div class="glass">
					<div class="eyebrow">Software Engineer</div>
					<h1>Building Fast, Fluid Interfaces</h1>
					<div class="tags">
						React <span class="dot">&#8226;</span> React Native <span class="dot">&#8226;</span> TypeScript
					</div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
