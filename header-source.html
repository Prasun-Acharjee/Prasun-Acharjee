<!-- Source for header.webp — rendered to frames and encoded as animated WebP.
     Every animation has a period that divides 6s so the loop is seamless. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05040f; }

  .stage {
    position: relative;
    width: 800px; height: 400px;
    overflow: hidden;
    border-radius: 20px;
    background: #05040f;
    font-family: 'DejaVu Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---- morphing mesh-gradient blobs ---- */
  .blob { position: absolute; border-radius: 50%; filter: blur(72px); opacity:.6; }
  .b1 { width: 360px; height: 320px; top: -130px; left: -110px;  background: #ff4f96; animation: m1 6s ease-in-out infinite; }
  .b2 { width: 400px; height: 360px; bottom: -170px; right: -120px; background: #4f7cff; animation: m2 6s ease-in-out infinite; }
  .b3 { width: 300px; height: 260px; top: -110px; right: 40px;    background: #22d3ee; animation: m3 6s ease-in-out infinite; }
  .b4 { width: 330px; height: 260px; bottom: -130px; left: 90px; background: #8b5cf6; animation: m4 6s ease-in-out infinite; }

  @keyframes m1 { 0%{transform:translate(0,0) scale(1);opacity:.85} 33%{transform:translate(70px,50px) scale(1.18);opacity:1}
                  66%{transform:translate(30px,90px) scale(.92);opacity:.7} 100%{transform:translate(0,0) scale(1);opacity:.85} }
  @keyframes m2 { 0%{transform:translate(0,0) scale(1);opacity:.9} 33%{transform:translate(-80px,-40px) scale(.9);opacity:.65}
                  66%{transform:translate(-40px,-90px) scale(1.2);opacity:1} 100%{transform:translate(0,0) scale(1);opacity:.9} }
  @keyframes m3 { 0%{transform:translate(0,0) scale(1);opacity:.6} 50%{transform:translate(-90px,70px) scale(1.25);opacity:.95}
                  100%{transform:translate(0,0) scale(1);opacity:.6} }
  @keyframes m4 { 0%{transform:translate(0,0) scale(1.05);opacity:.75} 50%{transform:translate(90px,-60px) scale(.88);opacity:1}
                  100%{transform:translate(0,0) scale(1.05);opacity:.75} }

  /* ---- drifting dot grid ---- */
  .grid {
    position: absolute; inset: -30px;
    background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px);
    background-size: 26px 26px;
    animation: grid 6s linear infinite;
    -webkit-mask-image: radial-gradient(70% 70% at 50% 50%, #000 30%, transparent 100%);
            mask-image: radial-gradient(70% 70% at 50% 50%, #000 30%, transparent 100%);
  }
  @keyframes grid { from { background-position: 0 0; } to { background-position: 26px 26px; } }

  .vignette { position:absolute; inset:0;
    background: radial-gradient(75% 75% at 50% 45%, rgba(5,4,15,0) 0%, rgba(5,4,15,.55) 70%, rgba(5,4,15,.85) 100%); }

  /* ---- floating particles ---- */
  .p { position: absolute; border-radius: 50%; background: #bfe9ff; filter: blur(.5px);
       animation: rise 6s linear infinite; }
  @keyframes rise {
    0%   { transform: translateY(60px)  scale(.6); opacity: 0; }
    18%  { opacity: .9; }
    82%  { opacity: .9; }
    100% { transform: translateY(-360px) scale(1);  opacity: 0; }
  }

  /* ---- rotating conic glow + gradient border ---- */
  .ring {
    position: absolute; top: 50%; left: 50%;
    width: 900px; height: 900px; margin: -450px 0 0 -450px;
    background: conic-gradient(from 0deg, transparent 0%, #ff4f96 12%, transparent 30%,
                #22d3ee 52%, transparent 68%, #8b5cf6 86%, transparent 100%);
    filter: blur(80px); opacity: .30;
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .frame {
    position: absolute; top: 50%; left: 50%;
    width: 648px; height: 210px;
    transform: translate(-50%,-50%);
    border-radius: 28px; padding: 1.5px;
    overflow: hidden;
  }
  .frame::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 760px; height: 760px; margin: -380px 0 0 -380px;
    background: conic-gradient(from 0deg, rgba(255,255,255,0) 0%, #ff4f96 15%,
                rgba(255,255,255,.9) 32%, #22d3ee 55%, rgba(255,255,255,0) 72%,
                #8b5cf6 88%, rgba(255,255,255,0) 100%);
    animation: spin 6s linear infinite;
  }

  .card {
    position: relative; width: 100%; height: 100%;
    border-radius: 26.5px;
    background: rgba(10, 9, 26, .80);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 30px 70px rgba(0,0,0,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }

  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 5.5px;
    text-transform: uppercase; color: #9fb0e8; margin-bottom: 14px;
  }
  .eyebrow i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #22d3ee;
               box-shadow: 0 0 10px #22d3ee; animation: blink 3s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  h1 {
    font-size: 34px; font-weight: 800; letter-spacing: .3px; line-height: 1.1; white-space: nowrap;
    background: linear-gradient(100deg, #ffffff 0%, #b7c6ff 25%, #7ef0ff 42%, #ffffff 60%, #ffb3d9 80%, #ffffff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sheen 3s linear infinite;
  }
  @keyframes sheen { to { background-position: 220% center; } }

  .bar { width: 66px; height: 3px; border-radius: 2px; margin: 14px 0 13px;
         background: linear-gradient(90deg, #ff4f96, #8b5cf6, #22d3ee); }

  .chips { display: flex; gap: 8px; }
  .chip {
    font-size: 11.5px; font-weight: 600; letter-spacing: .8px; color: #dce6ff;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
  }

  /* light sweep across the card */
  .sweep {
    position: absolute; top: 0; left: 0; width: 130px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    transform: skewX(-18deg);
    animation: sweep 6s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(-200px) skewX(-18deg); }
                       to { transform: translateX(760px)  skewX(-18deg); } }
</style>

<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="ring"></div>
  <div class="grid"></div>
  <div class="vignette"></div>

  <div class="p" style="width:4px;height:4px;left:120px;top:300px;animation-delay:-0.2s"></div>
  <div class="p" style="width:3px;height:3px;left:210px;top:340px;animation-delay:-1.4s"></div>
  <div class="p" style="width:5px;height:5px;left:330px;top:320px;animation-delay:-2.6s"></div>
  <div class="p" style="width:3px;height:3px;left:470px;top:350px;animation-delay:-3.8s"></div>
  <div class="p" style="width:4px;height:4px;left:600px;top:310px;animation-delay:-0.9s"></div>
  <div class="p" style="width:3px;height:3px;left:690px;top:345px;animation-delay:-2.1s"></div>
  <div class="p" style="width:4px;height:4px;left:60px;top:355px;animation-delay:-4.6s"></div>
  <div class="p" style="width:3px;height:3px;left:400px;top:360px;animation-delay:-5.3s"></div>
  <div class="p" style="width:4px;height:4px;left:760px;top:330px;animation-delay:-3.1s"></div>

  <div class="frame">
    <div class="card">
      <div class="eyebrow"><i></i>Software Engineer<i></i></div>
      <h1>Building Fast, Fluid Interfaces</h1>
      <div class="bar"></div>
      <div class="chips">
        <span class="chip">React</span>
        <span class="chip">React Native</span>
        <span class="chip">TypeScript</span>
      </div>
      <div class="sweep"></div>
    </div>
  </div>
</div>
