<!-- Source for header.webp — rendered to frames and encoded as animated WebP.
     Every animation period divides 12s, so the loop closes seamlessly.
     The dot grid is intentionally static: unchanged pixels cost almost
     nothing once WebP frame-differencing kicks in. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05040f; }

  .stage {
    position: relative;
    width: 800px; height: 400px;
    overflow: hidden;
    border-radius: 20px;
    background: #05040f;
    font-family: 'DejaVu Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---- morphing mesh gradient (12s, half the old speed) ---- */
  .blob { position: absolute; border-radius: 50%; filter: blur(76px); opacity: .6; }
  .b1 { width: 380px; height: 330px; top: -140px; left: -120px;   background: #ff4f96; animation: m1 12s ease-in-out infinite; }
  .b2 { width: 420px; height: 370px; bottom: -180px; right: -130px; background: #4f7cff; animation: m2 12s ease-in-out infinite; }
  .b3 { width: 310px; height: 270px; top: -120px; right: 40px;     background: #22d3ee; animation: m3 12s ease-in-out infinite; }
  .b4 { width: 340px; height: 270px; bottom: -140px; left: 90px;   background: #8b5cf6; animation: m4 12s ease-in-out infinite; }

  @keyframes m1 { 0%{transform:translate(0,0) scale(1);opacity:.80} 33%{transform:translate(46px,32px) scale(1.12);opacity:1}
                  66%{transform:translate(20px,58px) scale(.94);opacity:.66} 100%{transform:translate(0,0) scale(1);opacity:.80} }
  @keyframes m2 { 0%{transform:translate(0,0) scale(1);opacity:.88} 33%{transform:translate(-52px,-26px) scale(.92);opacity:.62}
                  66%{transform:translate(-26px,-58px) scale(1.14);opacity:1} 100%{transform:translate(0,0) scale(1);opacity:.88} }
  @keyframes m3 { 0%{transform:translate(0,0) scale(1);opacity:.58} 50%{transform:translate(-58px,46px) scale(1.18);opacity:.92}
                  100%{transform:translate(0,0) scale(1);opacity:.58} }
  @keyframes m4 { 0%{transform:translate(0,0) scale(1.04);opacity:.72} 50%{transform:translate(58px,-38px) scale(.9);opacity:.98}
                  100%{transform:translate(0,0) scale(1.04);opacity:.72} }

  /* static texture — costs almost nothing to encode */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.15) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(70% 70% at 50% 50%, #000 25%, transparent 100%);
            mask-image: radial-gradient(70% 70% at 50% 50%, #000 25%, transparent 100%);
  }

  .vignette { position: absolute; inset: 0;
    background: radial-gradient(78% 78% at 50% 45%, rgba(5,4,15,0) 0%, rgba(5,4,15,.52) 68%, rgba(5,4,15,.86) 100%); }

  /* ---- particles: slow rise over the full 12s ---- */
  .p { position: absolute; border-radius: 50%; background: #cfe9ff; filter: blur(.5px);
       animation: rise 12s linear infinite; }
  @keyframes rise {
    0%   { transform: translateY(50px)   scale(.6); opacity: 0; }
    20%  { opacity: .85; }
    80%  { opacity: .85; }
    100% { transform: translateY(-330px) scale(1);  opacity: 0; }
  }

  /* ---- slow rotating colour wash ---- */
  .ring {
    position: absolute; top: 50%; left: 50%;
    width: 900px; height: 900px; margin: -450px 0 0 -450px;
    background: conic-gradient(from 0deg, transparent 0%, #ff4f96 12%, transparent 30%,
                #22d3ee 52%, transparent 68%, #8b5cf6 86%, transparent 100%);
    filter: blur(84px); opacity: .28;
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- glass card ---- */
  .frame {
    position: absolute; top: 50%; left: 50%;
    width: 648px; height: 210px;
    transform: translate(-50%,-50%);
    border-radius: 28px; padding: 1.5px;
    overflow: hidden;
    box-shadow: 0 34px 80px rgba(0,0,0,.55);
  }
  .frame::before {                        /* rotating gradient rim */
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 780px; height: 780px; margin: -390px 0 0 -390px;
    background: conic-gradient(from 0deg, rgba(255,255,255,0) 0%, #ff4f96 15%,
                rgba(255,255,255,.85) 32%, #22d3ee 55%, rgba(255,255,255,0) 72%,
                #8b5cf6 88%, rgba(255,255,255,0) 100%);
    animation: spin 12s linear infinite;
  }

  .card {
    position: relative; width: 100%; height: 100%;
    border-radius: 26.5px;
    overflow: hidden;
    /* thinner tint + heavier blur = the mesh reads through the glass */
    background: linear-gradient(150deg, rgba(24,20,52,.60), rgba(8,7,22,.72));
    -webkit-backdrop-filter: blur(26px) saturate(165%);
            backdrop-filter: blur(26px) saturate(165%);
    /* beveled rim: bright top edge, soft side edges, dark base */
    box-shadow:
      inset 0  1.4px 0 rgba(255,255,255,.34),
      inset  1.4px 0 0 rgba(255,255,255,.10),
      inset -1.4px 0 0 rgba(255,255,255,.10),
      inset 0 -1.4px 0 rgba(255,255,255,.05),
      inset 0 -30px 60px rgba(0,0,0,.30);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .card::before {                         /* top gloss */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 38%, transparent 62%);
  }

  /* drifting specular highlight inside the glass */
  .spec {
    position: absolute; width: 360px; height: 210px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 66%);
    filter: blur(22px);
    animation: spec 12s ease-in-out infinite;
  }
  @keyframes spec {
    0%   { transform: translate(-190px, -46px); }
    50%  { transform: translate( 190px,  38px); }
    100% { transform: translate(-190px, -46px); }
  }

  /* slow light sweep, one pass per loop */
  .sweep {
    position: absolute; top: 0; left: 0; width: 150px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    animation: sweep 12s ease-in-out infinite;
  }
  @keyframes sweep { from { transform: translateX(-220px) skewX(-18deg); }
                       to { transform: translateX(780px)  skewX(-18deg); } }

  .content { position: relative; z-index: 2; }

  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 5.5px;
    text-transform: uppercase; color: #a8b7ea; margin-bottom: 14px;
  }
  .eyebrow i { display: block; width: 5px; height: 5px; border-radius: 50%; background: #22d3ee;
               box-shadow: 0 0 10px #22d3ee; animation: blink 4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  h1 {
    font-size: 34px; font-weight: 800; letter-spacing: .3px; line-height: 1.1; white-space: nowrap;
    background: linear-gradient(100deg, #ffffff 0%, #b7c6ff 25%, #7ef0ff 42%, #ffffff 60%, #ffb3d9 80%, #ffffff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sheen 6s linear infinite;
  }
  @keyframes sheen { to { background-position: 220% center; } }

  .bar { width: 66px; height: 3px; border-radius: 2px; margin: 14px auto 13px;
         background: linear-gradient(90deg, #ff4f96, #8b5cf6, #22d3ee); }

  .chips { display: flex; gap: 8px; justify-content: center; }
  .chip {
    font-size: 11.5px; font-weight: 600; letter-spacing: .8px; color: #e4ecff;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
  }
</style>

<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="ring"></div>
  <div class="grid"></div>
  <div class="vignette"></div>

  <div class="p" style="width:4px;height:4px;left:120px;top:300px;animation-delay:-0.4s"></div>
  <div class="p" style="width:3px;height:3px;left:210px;top:340px;animation-delay:-2.8s"></div>
  <div class="p" style="width:5px;height:5px;left:330px;top:320px;animation-delay:-5.2s"></div>
  <div class="p" style="width:3px;height:3px;left:470px;top:350px;animation-delay:-7.6s"></div>
  <div class="p" style="width:4px;height:4px;left:600px;top:310px;animation-delay:-1.8s"></div>
  <div class="p" style="width:3px;height:3px;left:690px;top:345px;animation-delay:-4.2s"></div>
  <div class="p" style="width:4px;height:4px;left:60px;top:355px;animation-delay:-9.2s"></div>
  <div class="p" style="width:3px;height:3px;left:400px;top:360px;animation-delay:-10.6s"></div>
  <div class="p" style="width:4px;height:4px;left:760px;top:330px;animation-delay:-6.2s"></div>

  <div class="frame">
    <div class="card">
      <div class="spec"></div>
      <div class="sweep"></div>
      <div class="content">
        <div class="eyebrow"><i></i>Software Engineer<i></i></div>
        <h1>Building Fast, Fluid Interfaces</h1>
        <div class="bar"></div>
        <div class="chips">
          <span class="chip">React</span>
          <span class="chip">React Native</span>
          <span class="chip">TypeScript</span>
        </div>
      </div>
    </div>
  </div>
</div>
